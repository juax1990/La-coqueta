<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>La coqueta</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/genfavicon-package/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Font Awesome -->
    <link href="/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <script src="basedatos/datos.js"></script>

    <!-- Customized Bootstrap Stylesheet -->

    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Contenedor para cargar la barra de menú usando JavaScript -->
    <div id="menu" class="barranav"></div>
    <!-- Contenido de la página - Inicio -->

    <!-- Carrusel -->

    <div id="header-carousel" class="carousel slide" data-ride="carousel">

        <!-- Indicadores -->
        <ol class="carousel-indicators"></ol>

        <!-- Contenedor de slides -->
        <div class="carousel-inner"></div>

        <a class="carousel-control-prev" href="#header-carousel" data-slide="prev">
            <div class="btn btn-dark" style="width: 45px; height: 45px;">
                <span class="carousel-control-prev-icon mb-n2"></span>
            </div>
        </a>
        <a class="carousel-control-next" href="#header-carousel" data-slide="next">
            <div class="btn btn-dark" style="width: 45px; height: 45px;">
                <span class="carousel-control-next-icon mb-n2"></span>
            </div>
        </a>

    </div>

    <!-- Fin del carrusel -->

    <!-- Script para cargar el carrusel de manera dinamica -->

    <script>
        const indicators = document.querySelector("#header-carousel .carousel-indicators");
        const inner = document.querySelector("#header-carousel .carousel-inner");

        elementos_carrusel.forEach((elemento, indice) => {

            /* === Indicadores === */
            const li = document.createElement("li");
            li.setAttribute("data-target", "#header-carousel");
            li.setAttribute("data-slide-to", indice);
            if (indice === 0) li.classList.add("active");
            indicators.appendChild(li);

            /* === Slide === */
            const item = document.createElement("div");
            item.classList.add("carousel-item");
            if (indice === 0) item.classList.add("active");



            item.innerHTML = `
            <div class="container h-100">
                <div class="row h-100 d-flex align-items-center">
                    
                    <!-- Texto centrado perfectamente -->
                    <div class="col-lg-6 d-flex align-items-center">
                        <div class="text-left w-100">
                            <h3 class="text-primary font-weight-bold mb-3">${elemento.nombre}</h3>
                            <p class="text-dark mb-4">${elemento.descripcion}</p>
                        </div>
                    </div>

                    <!-- Columna de la imagen (DERECHA) -->
                    <div class="col-lg-6 d-flex justify-content-center align-items-center">
                        <img class="img-fluid" id="imgcarrusel"src="${elemento.imagen}" alt="${elemento.nombre}">
                    </div>

                </div>
            </div>
        `;

            inner.appendChild(item);
        });
    </script>
    <!-- Temporizador del carrusel -->
    <script>
        $('#header-carousel').carousel({
            interval: 4000, // 4 segundos
            ride: 'carousel'
        });
    </script>
    <!-- Fin del carrusel y srcript de este -->

    <!-- Featured Start -->
    <div class="container-fluid pt-5">
        <div class="row px-xl-5 pb-3">
            <div class="col-lg-3 col-md-6 col-sm-12 pb-1">
                <div class="d-flex align-items-center border mb-4" style="padding: 30px;">
                    <h1 class="fa fa-check text-primary m-0 mr-3"></h1>
                    <h5 class="font-weight-semi-bold m-0">Calidad</h5>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12 pb-1">
                <div class="d-flex align-items-center border mb-4" style="padding: 30px;">
                    <h1 class="fa fa-shipping-fast text-primary m-0 mr-2"></h1>
                    <h5 class="font-weight-semi-bold m-0">Garantía de envio</h5>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12 pb-1">
                <div class="d-flex align-items-center border mb-4" style="padding: 30px;">
                    <h1 class="fa fa-exchange-alt text-primary m-0 mr-3"></h1>
                    <h5 class="font-weight-semi-bold m-0">14 dias de retorno</h5>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12 pb-1">
                <div class="d-flex align-items-center border mb-4" style="padding: 30px;">
                    <h1 class="fa fa-shirt text-primary m-0 mr-3"></h1>
                    <h5 class="font-weight-semi-bold m-0">Boutique</h5>
                </div>
            </div>
        </div>
    </div>
    <!-- Featured End -->


    <!-- Categories Start -->
    <div class="container-fluid pt-5">
        <div class="row px-xl-5 pb-3" id="contenedor_categorias">
            <!-- Las categorías se cargarán aquí con JS -->
            <script>
                const contenedor = document.getElementById("contenedor_categorias");

                lista_categorias.forEach(categoria => {

                    const divCol = document.createElement("div");
                    divCol.classList.add("col-lg-4", "col-md-6", "pb-1");

                    divCol.innerHTML = `
        <div class="cat-item d-flex flex-column border mb-4" style="padding: 30px;">
            <p class="text-right text-primary">Vista rápida</p>
            <a href="${categoria.enlace}" class="cat-img position-relative overflow-hidden mb-3">
                <img class="img-fluid" src="${categoria.imagen}" alt="${categoria.nombre}">
            </a>
            <h5 class="font-weight-semi-bold m-0">${categoria.nombre}</h5>
        </div>
    `;

                    contenedor.appendChild(divCol);
                });
            </script>

        </div>
    </div>
    <!-- Categories End -->


    <!-- Offer Start -->
    <div class="container-fluid offer pt-5">
        <div class="row px-xl-5" id="contenedor-ofertas">
            <!-- Las ofertas se cargarán aquí con JS -->
            <script>
                const contenedorOfertas = document.getElementById("contenedor-ofertas");

                lista_ofertas.forEach(oferta => {

                    const col = document.createElement("div");
                    col.classList.add("col-md-6", "pb-4");

                    const alineacionTexto = oferta.alineacion === "left"
                        ? "text-md-right"
                        : "text-md-left";

                    col.innerHTML = `
        <div class="position-relative bg-secondary text-center ${alineacionTexto} text-white mb-2 py-5 px-5">
            <img src="${oferta.imagen}" class="cat-img position-relative" alt="">
            <div class="position-relative" style="z-index: 1;">
                <h5 class="text-uppercase text-primary mb-3">${oferta.porcentaje}</h5>
                <h3 class="mb-4 font-weight-semi-bold">${oferta.titulo}</h1>
                <a href="${oferta.enlace}" class="btn btn-outline-primary py-md-2 px-md-3">
                    ${oferta.boton}
                </a>
            </div>
        </div>
    `;

                    contenedorOfertas.appendChild(col);
                });
            </script>

        </div>
    </div>
    <!-- Offer End -->


    <!-- Products Start -->
    <div class="container-fluid pt-5">
        <div class="text-center mb-4">
            <h2 class="section-title px-5"><span class="px-2">Prendas a la moda</span></h2>
        </div>
        <div class="row px-xl-5 pb-3" id="contenedor_moda">
            <!-- Los productos se cargan con JS -->
            <script>
                const contenedorModa = document.getElementById("contenedor_moda");

                lista_moda.forEach(moda => {

                    const col = document.createElement("div");
                    col.classList.add("col-lg-3", "col-md-6", "col-sm-12", "pb-1");

                    col.innerHTML = `
        <div class="card product-item border-0 mb-4">
            <div class="card-header product-img position-relative overflow-hidden bg-transparent border p-0">
                <img class="cat-img img-fluid w-100" src="${moda.imagen}" alt="${moda.nombre}">
            </div>

            <div class="card-body border-left border-right text-center p-0 pt-4 pb-3">
                <h6 class="text-truncate mb-3">${moda.nombre}</h6>
                <div class="d-flex justify-content-center">
                    <h6>$${moda.precio}</h6>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-between bg-light border">
                <a href="${moda.enlace}" class="btn btn-sm text-dark p-0">
                    <i class="fas fa-eye text-primary mr-1"></i>Ver detalle
                </a>
                <a href="#" class="btn btn-sm text-dark p-0">
                    <i class="fas fa-shopping-cart text-primary mr-1"></i>Agregar
                </a>
            </div>
        </div>
    `;

                    contenedorModa.appendChild(col);
                });
            </script>

        </div>
    </div>
    <!-- Products End -->


    <!-- Vendor Start -->
    <div class="container-fluid py-5">
        <div class="row px-xl-5">
            <div class="col">
                <div class="owl-carousel vendor-carousel">
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-1.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-2.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-3.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-4.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-5.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-6.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-7.jpg" alt="">
                    </div>
                    <div class="vendor-item border p-4">
                        <img src="img/vendor-8.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Vendor End -->

    <!-- Contenido de la página - Final -->
    <!-- Contenedor para cargar el pie de página usando JavaScript -->
    <div id="pie"></div>
    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Contact Javascript File -->
    <script src="mail/jqBootstrapValidation.min.js"></script>
    <script src="mail/contact.js"></script>

    <!-- Script para que se carguen el pie de pagina y el menu -->
    <script src="js/custom.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarFragmento("menu", "menu.html");
            cargarFragmento("pie", "pie.html");
        });
    </script>
</body>

</html>
