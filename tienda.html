<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>La coqueta</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/genfavicon-package/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Font Awesome -->
    <link href="/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link rel="stylesheet" href="css/custom.css">
    <link href="css/style.css" rel="stylesheet">
    <script src="basedatos/productos.js"></script>

</head>

<body>
    <!-- Contenedor para cargar la barra de menú usando JavaScript -->
    <div id="menu" class="barranav"></div>
    <!-- Contenido de la página - Inicio -->

    <!-- Page Header Start -->
    <div class="container-fluid bg-secondary mb-5">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 300px">
            <h1 class="font-weight-semi-bold text-primary mb-3">Nuestra tienda</h1>
        </div>
    </div>
    <!-- Page Header End -->


    <!-- Shop Start -->
    <div class="container-fluid pt-5">
        <div class="row px-xl-5">
            <div class="col-lg-3 d-none d-lg-block">
                <a class="btn shadow-none d-flex align-items-center justify-content-between bg-primary text-white w-100"
                    data-toggle="collapse" href="#navbar-vertical"
                    style="height: 65px; margin-top: -1px; padding: 0 30px;">
                    <h6 class="m-0">Categorias</h6>
                    <i class="fa fa-angle-down text-dark"></i>
                </a>
                <nav class="collapse show navbar navbar-vertical navbar-light align-items-start p-0 border border-top-0 border-bottom-0"
                    id="navbar-vertical">
                    <div class="navbar-nav w-100 overflow-hidden" style="height: 410px">
                        <a href="tienda.html?cat=9001" class="nav-item nav-link">Pantalones</a>
                        <a href="tienda.html?cat=9002" class="nav-item nav-link">Jeans</a>
                        <a href="tienda.html?cat=9003" class="nav-item nav-link">Blusas</a>
                        <a href="tienda.html?cat=9004" class="nav-item nav-link">Conjuntos</a>
                        <a href="tienda.html?cat=9005" class="nav-item nav-link">Camisetas</a>
                        <a href="tienda.html?cat=9008" class="nav-item nav-link">Vestidos</a>
                    </div>
                </nav>
            </div>


            <!-- Inicio productos -->
            <div class="col-lg-9 col-md-12">

                <!-- filtros arriba se quedan -->

                <div id="etiqueta_productos" class="row pb-3"></div>
                <script>
                    document.addEventListener("DOMContentLoaded", () => {

                        // Obtener categoría desde la URL (?cat=jeans)
                        const urlParams = new URLSearchParams(window.location.search);
                        const categoria = urlParams.get("cat");

                        const etiqueta_productos = document.getElementById("etiqueta_productos");

                        // Esta función debe venir de tu lógica / BD
                        const productos_filtrados = obtenerProductosServicios(categoria);

                        etiqueta_productos.innerHTML = ""; // limpia antes de cargar

                        productos_filtrados.forEach((producto) => {

                            const div_col = document.createElement("div");
                            div_col.className = "col-lg-4 col-md-6 col-sm-12 pb-1";

                            div_col.innerHTML = `
      <div class="card product-item border-0 mb-4">
        <div class="card-header product-img position-relative overflow-hidden bg-transparent border p-0">
          <img class="img-fluid w-100" src="${producto.imagen}" alt="${producto.nombre}">
        </div>

        <div class="card-body border-left border-right text-center p-0 pt-4 pb-3">
          <h6 class="text-truncate mb-3">${producto.nombre}</h6>
          <div class="d-flex justify-content-center">
            <h6>$${producto.precio}</h6>
          </div>
        </div>

        <div class="card-footer d-flex justify-content-between bg-light border">
          <a href="detalle_producto.html?codigo_producto=${producto.codigo}" 
             class="btn btn-sm text-dark p-0">
            <i class="fas fa-eye text-primary mr-1"></i>Ver detalle
          </a>

          <button class="btn btn-sm text-dark p-0 btn-add">
            <i class="fas fa-shopping-cart text-primary mr-1"></i>Agregar
          </button>
        </div>
      </div>
    `;

                            etiqueta_productos.appendChild(div_col);

                            div_col.querySelector(".btn-add").addEventListener("click", () => {
                                agregarProducto(producto);
                            });

                        });
                    });
                </script>

                <!-- paginación abajo se queda -->

            </div>
            <!-- Fin de productos -->
        </div>
    </div>
    <!-- Shop End -->

    <!-- Contenido de la página - Final -->
    <!-- Contenedor para cargar el pie de página usando JavaScript -->
    <div id="pie"></div>
    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Contact Javascript File -->
    <script src="mail/jqBootstrapValidation.min.js"></script>
    <script src="mail/contact.js"></script>

    <!-- Script para que se carguen el pie de pagina y el menu -->
    <script src="js/custom.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarFragmento("menu", "menu.html");
            cargarFragmento("pie", "pie.html");
        });
    </script>

</body>

</html>
